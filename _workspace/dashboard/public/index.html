<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspace · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-left">
    <h1 id="project-name">—</h1>
    <p class="project-path" id="project-path"></p>
  </div>
  <div class="masthead-right">
    <div class="status-pill" id="status-pill">
      <span class="dot"></span>
      <span class="label">checking…</span>
    </div>
    <p class="status-summary" id="status-summary"></p>
  </div>
</header>

<main class="grid">
  <section class="card" id="tasks-card">
    <h2>Tasks</h2>
    <div class="task-counts" id="task-counts"></div>
    <ul class="task-list" id="task-list"></ul>
  </section>

  <section class="card" id="routines-card">
    <h2>Routines</h2>
    <table class="routines">
      <thead><tr>
        <th>name</th><th>cron</th><th>agent</th><th>model</th>
        <th>state</th><th></th>
      </tr></thead>
      <tbody id="routines-body"></tbody>
    </table>
  </section>

  <section class="card" id="agents-card">
    <h2>Agents</h2>
    <ul class="agents" id="agents-list"></ul>
  </section>

  <section class="card" id="runs-card">
    <h2>Recent runs</h2>
    <table class="runs">
      <thead><tr>
        <th>when</th><th>routine</th><th>turns</th><th>cost</th><th></th>
      </tr></thead>
      <tbody id="runs-body"></tbody>
    </table>
  </section>

  <section class="card live" id="live-card">
    <h2>Live stream</h2>
    <p class="live-hint">Tail of the most recent routine. Newest first.</p>
    <ol id="live-feed" class="live-feed"></ol>
  </section>
</main>

<aside class="drawer" id="drawer">
  <header>
    <h3 id="drawer-title">Run</h3>
    <button id="drawer-close" aria-label="Close">×</button>
  </header>
  <pre id="drawer-body"></pre>
</aside>

<script src="/app.js"></script>
</body>
</html>
